acme {
    cache_dir = "/tmp/.acme-cache"
    email = "email@domain.test"
    # Uncomment the line below to accept the ACME provider Terms of Service. This is
    # required to use ACME to provide certificates for the OIDC discovery provider.
    # tos_accepted = true
}
server_api {
    address = "unix:///tmp/spire-server/private/api.sock"
}
