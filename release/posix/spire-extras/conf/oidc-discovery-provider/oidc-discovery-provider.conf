log_level = "debug"
domains = ["public.example.org"]

# Optional TLS profile for terminating HTTPS listeners (ACME / disk cert).
# tls_profile {
#     min_tls_version = "VersionTLS13"
#     cipher_suites = ["TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256"]
#     curve_preferences = ["X25519", "secp256r1"]
