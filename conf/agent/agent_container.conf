agent {
    data_dir = "/var/lib/spire/agent/.data"
    log_level = "DEBUG"
    server_address = "127.0.0.1"
    server_port = "8081"
    socket_path ="/run/spire/agent/public/api.sock"
    trust_bundle_path = "/etc/spire/agent/dummy_root_ca.crt"
    trust_domain = "example.org"

    # Optional tls_config for terminating agent TLS listeners (SPIFFE Broker
    # API, Prometheus HTTPS). Not applied to outbound server gRPC. Parsed at
    # startup; min TLS 1.2 floor. See agent_full.conf for validation rules.
    # tls_config {
    #     min_tls_version = "VersionTLS13"
    #     cipher_suites = ["TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256"]
    #     curve_preferences = ["X25519", "secp256r1"]
    # }
}

plugins {
    NodeAttestor "join_token" {
        plugin_data {
        }
    }
    KeyManager "disk" {
        plugin_data {
            directory = "/var/lib/spire/agent/.data"
        }
    }
    WorkloadAttestor "unix" {
        plugin_data {
        }
    }
}
