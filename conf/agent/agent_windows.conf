agent {
    data_dir = ".\\.data"
    log_level = "DEBUG"
    server_address = "127.0.0.1"
    server_port = "8081"
    trust_bundle_path = ".\\conf\\agent\\dummy_root_ca.crt"
    trust_domain = "example.org"

    # Optional tls_config for terminating agent TLS listeners (SPIFFE Broker
    # API, Prometheus HTTPS). Not applied to outbound server gRPC. See agent_full.conf.
    # tls_config {
    #     min_tls_version = "VersionTLS13"
    #     cipher_suites = ["TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256"]
    #     curve_preferences = ["X25519", "secp256r1"]
    # }

    experimental {
        named_pipe_name = "\\spire-agent\\public\\api"
    }
}

plugins {
    NodeAttestor "join_token" {
        plugin_data {
        }
    }
    KeyManager "disk" {
        plugin_data {
            directory = ".\\.data"
        }
    }
    WorkloadAttestor "windows" {}
    WorkloadAttestor "docker" {
        plugin_data {
        }
    }
}
