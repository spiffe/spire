name: Setup Go
description: >-
  Installs the Go toolchain declared in go.mod and restores the Go module
  cache, the Go build cache and the .build tool cache. This action only
  restores. The Warm Caches workflow saves the caches from the main branch,
  which is the only scope every pull request and merge queue run can read.

outputs:
  gomodcache:
    description: Path of the Go module cache
    value: ${{ steps.keys.outputs.gomodcache }}
  gocache:
    description: Path of the Go build cache
    value: ${{ steps.keys.outputs.gocache }}
  gomod-key:
    description: Cache key of the Go module cache
    value: ${{ steps.keys.outputs.gomod-key }}
  gomod-cache-hit:
    description: Whether a module cache for the current go.sum files was found (Linux only)
    value: ${{ steps.gomod.outputs.cache-hit }}
  gobuild-key:
    description: Cache key of the Go build cache
    value: ${{ steps.keys.outputs.gobuild-key }}
  tools-key:
    description: Cache key of the .build tool cache
    value: ${{ steps.keys.outputs.tools-key }}

runs:
  using: composite
  steps:
    - name: Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: 'go.mod'
        cache: false
    - name: Compute cache keys
      id: keys
      shell: bash
      env:
        GOSUM_HASH: ${{ hashFiles('**/go.sum') }}
      run: |
        # The module cache holds sources, so it is shared across architectures
        # and runner images and only changes with go.sum.
        #
        # The build cache holds compiled objects. They depend on the Go
        # toolchain, and cgo objects also depend on the C toolchain of the
        # runner image (ImageOS is ubuntu22, ubuntu24, win22, macos15...), so
        # the key includes both. The commit is part of the key so that the
        # Warm Caches workflow saves a fresh entry on every push to main, and
        # consumers fall back to the newest one by prefix.
        prefix="${RUNNER_OS}-${RUNNER_ARCH}-${ImageOS:-unknown}-$(go env GOVERSION)"
        {
          echo "gomod-key=${RUNNER_OS}-gomod-${GOSUM_HASH}"
          echo "gomod-prefix=${RUNNER_OS}-gomod-"
          echo "gobuild-key=${prefix}-gobuild-${GITHUB_SHA}"
          echo "gobuild-prefix=${prefix}-gobuild-"
          echo "tools-key=${prefix}-tools-${GITHUB_SHA}"
          echo "tools-prefix=${prefix}-tools-"
          echo "gomodcache=$(go env GOMODCACHE)"
          echo "gocache=$(go env GOCACHE)"
        } >> "$GITHUB_OUTPUT"
    # Only Linux keeps a module cache. It serves about thirty jobs per run,
    # while a macOS or Windows one would spend 0.6 to 0.7 GB of the 10 GB
    # repository cache budget on one to three jobs that can download the
    # modules in about a minute instead.
    - name: Restore Go module cache
      id: gomod
      if: runner.os == 'Linux'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.keys.outputs.gomodcache }}
        key: ${{ steps.keys.outputs.gomod-key }}
        restore-keys: ${{ steps.keys.outputs.gomod-prefix }}
    - name: Restore Go build cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.keys.outputs.gocache }}
        key: ${{ steps.keys.outputs.gobuild-key }}
        restore-keys: ${{ steps.keys.outputs.gobuild-prefix }}
    - name: Restore build tool cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .build
        key: ${{ steps.keys.outputs.tools-key }}
        restore-keys: ${{ steps.keys.outputs.tools-prefix }}
    - name: Download modules
      shell: bash
      # Go does not retry a failed module download, and with the default
      # GOPROXY it only falls back to a direct fetch on a 404 or 410, so one
      # failed read from the proxy fails the job. The pipe makes Go fall back
      # on any error (checksums are still verified against the sum database),
      # and downloading everything in go.mod up front with retries means the
      # build, test and tidy steps that follow never touch the network.
      run: |
        export GOPROXY="https://proxy.golang.org|direct"
        echo "GOPROXY=${GOPROXY}" >> "$GITHUB_ENV"
        ./.github/workflows/scripts/retry.sh go mod download
