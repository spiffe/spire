name: assign-reviewer-review-capture

# Unprivileged half of the review ball-in-court update.
#
# The pull_request_review token is read-only for PRs from forks, so the
# assignee write cannot happen here. This workflow only records the review
# event in an artifact, which the privileged assign-reviewer-review-apply
# workflow (triggered via workflow_run) uses to move the assignee with a
# write token. The logic lives in https://github.com/spiffe/assign-reviewer.
#
# GitHub holds this run for approval on a first-time contributor's pull
# request and creates none while the pull request has a merge conflict. The
# assign-reviewer-reconcile workflow picks up the review transitions lost
# that way.
#
# It never writes to the repository and never checks out or runs any PR code.
# Note that pull_request_review runs the PR's own copy of this workflow, so a
# fork PR can run a modified version of this file. That gains no privileges
# (the token stays read-only), and the apply side treats the artifact as
# untrusted.
#
# The name above is referenced by the workflow_run filter in
# assign_reviewer_review_apply.yaml, so the two must change together.

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: spiffe/assign-reviewer/capture@438a6a3984a58cf27b76d459b5399415b0a0d9b4 # main
