server {
    admin_ids = ["spiffe://example.org/admin"]
    agent_ttl = "1h"
    audit_log_enabled = true
    audit_log_exclude_agent_sync = true
    disable_jwt_svids = false
    jwt_key_type = "ec-p256"
    log_source_location = true
    prune_attested_nodes_batch_size = 500
    prune_tofu_nodes = true
    profiling_enabled = true
    profiling_port = 6060
    profiling_freq = 5
    profiling_names = ["heap"]
    bind_address = "127.0.0.1"
    bind_port = 8081
    ca_key_type = "ec-p384"
    ca_subject {
        country = ["US"]
        organization = ["SPIFFE"]
        common_name = "ca"
    }
    ca_ttl = "48h"
    data_dir = "/var/lib/spire"
    default_x509_svid_ttl = "2h"
    default_jwt_svid_ttl = "10m"
    jwt_issuer = "https://issuer.example.org"
    log_file = "/var/log/spire.log"
    log_file_rotation {
        max_size_mb = 10
        max_files = 3
    }
    log_level = "DEBUG"
    log_format = "json"
    prune_attested_nodes_expired_for = "24h"
    ratelimit {
        attestation = false
        signing = true
    }
    socket_path = "/tmp/spire-server.sock"
    trust_domain = "example.org"
    max_attested_node_info_staleness = "1m"
    tls_config {
        min_tls_version = "VersionTLS13"
        curve_preferences = ["X25519"]
    }
    federation {
        bundle_endpoint {
            address = "0.0.0.0"
            port = 8443
            refresh_hint = "5m"
            profile "https_web" {
                serving_cert_file {
                    cert_file_path = "/cert.pem"
                    key_file_path = "/key.pem"
                    file_sync_interval = "1h"
                }
            }
        }
        federates_with "domain1.test" {
            bundle_endpoint_url = "https://1.2.3.4:8443"
            bundle_endpoint_profile "https_spiffe" {
                endpoint_spiffe_id = "spiffe://domain1.test/beserver"
            }
            bootstrap_bundle_path = "/bundle.pem"
        }
        federates_with "domain2.test" {
            bundle_endpoint_url = "https://example.org:8443"
            bundle_endpoint_profile "https_web" {}
        }
    }
    experimental {
        cache_reload_interval = "10s"
        full_cache_reload_interval = "1m"
        prune_events_older_than = "12h"
        event_timeout = "15m"
        sql_transaction_timeout = "24h"
        agent_spiffe_id_as_selector = true
        allow_nonconforming_agent_ids = true
        enable_wit_svids = true
        wit_key_type = "ec-p256"
        wit_issuer = "https://wit.example.org"
        default_wit_svid_ttl = "5m"
        named_pipe_name = "\\spire-server\\private\\api"
        events_based_cache = true
        require_pq_kem = true
        feature_flags = ["flag1"]
        auth_opa_policy_engine {
            local {
                rego_path = "/policy.rego"
                policy_data_path = "/policy.json"
            }
        }
    }
}

plugins {
    DataStore "sql" {
        plugin_data {
            database_type "aws_postgres" {
                region = "us-east-1"
            }
            connection_string = "dbname=spire"
            max_open_conns = 10
        }
    }
    KeyManager "disk" {
        plugin_data_file = "keymanager.conf"
    }
    UpstreamAuthority "disk" {
        plugin_cmd = "./upstream"
        plugin_args = ["-v"]
        plugin_checksum = "abc"
        enabled = false
        plugin_data {
            cert_file_path = "/ca.crt"
            key_file_path = "/ca.key"
        }
    }
}

telemetry {
    Prometheus {
        host = "localhost"
        port = 9988
        tls {
            cert_file = "/cert.pem"
            key_file = "/key.pem"
            client_ca_file = "/ca.pem"
            use_spire_svid = false
            authorized_spiffe_ids = ["spiffe://example.org/scraper"]
        }
    }
    M3 = [
        { address = "localhost:9000", env = "prod" },
    ]
    DogStatsd = [
        { address = "localhost:8125" },
    ]
    Statsd = [
        { address = "localhost:1337" },
    ]
    InMem {}
    MetricPrefix = "spire"
    AllowedPrefixes = ["spire_server"]
    BlockedPrefixes = ["spire_server_ca"]
    AllowedLabels = ["method"]
    BlockedLabels = ["status"]
    EnableTrustDomainLabel = true
    EnableHostnameLabel = false
}

health_checks {
    listener_enabled = true
    bind_address = "0.0.0.0"
    bind_port = "8080"
    live_path = "/live"
    ready_path = "/ready"
    check_interval = "30s"
}
