agent {
    data_dir = "c:/spire/data/agent"
    log_level = "DEBUG"
    server_address = "spire-server"
    log_file ="c:/spire/conf/agent/logs.txt"
    server_port = "8081"
    trust_bundle_path = "c:/spire/conf/agent/bootstrap.crt"
    trust_domain = "domain.test"

    # Exercises the in process rotation path under a real Windows service. The
    # limit is deliberately far larger than this suite produces, so the other
    # steps can keep asserting against logs.txt without racing a rotation.
    log_file_rotation {
        max_size_mb = 100
        max_files = 3
    }
}

plugins {
    NodeAttestor "x509pop" {
        plugin_data {
            private_key_path = "c:/spire/conf/agent/agent.key.pem"
            certificate_path = "c:/spire/conf/agent/agent.crt.pem"
        }
    }
    KeyManager "disk" {
        plugin_data {
            directory = "c:/spire/data/agent"
        }
    }
    WorkloadAttestor "windows" {
    }
}
