server {
	bind_address = "0.0.0.0"
	bind_port = "8081"
	trust_domain = "domain.test"
	log_file ="c:/spire/conf/server/logs.txt"
	data_dir = "c:/spire/data/server"
	log_level = "DEBUG"

	# Exercises the in process rotation path under a real Windows service. The
	# limit is deliberately far larger than this suite produces, so the other
	# steps can keep asserting against logs.txt without racing a rotation.
	log_file_rotation {
		max_size_mb = 100
		max_files = 3
		max_age_days = 7
	}
}

plugins {
	DataStore "sql" {
		plugin_data {
			database_type = "sqlite3"
			connection_string = "c:/spire/data/server/datastore.sqlite3"
		}
	}
	NodeAttestor "x509pop" {
		plugin_data {
			ca_bundle_path = "c:/spire/conf/server/agent-cacert.pem"
		}
	}
	KeyManager "memory" {
		plugin_data = {}
	}
}
