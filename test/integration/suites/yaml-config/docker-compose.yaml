services:
  spire-server:
    image: spire-server:latest-local
    volumes:
      - ./conf/server:/opt/spire/conf/server
    command: ["-config", "/opt/spire/conf/server/server.yaml"]
  spire-agent:
    image: spire-agent:latest-local
    volumes:
      - ./conf/agent:/opt/spire/conf/agent
    command: ["-config", "/opt/spire/conf/agent/agent.yaml"]
