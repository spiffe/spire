agent:
  dataDir: "/opt/spire/data/agent"
  logLevel: "DEBUG"
  serverAddress: "spire-server"
  serverPort: 8081
  trustBundlePath: "/opt/spire/conf/agent/bootstrap.crt"
  trustDomain: "domain.test"
  # The TOKEN is replaced with the actual token generated by SPIRE server
  # during the test run.
  joinToken: "TOKEN"
  sds:
    defaultSvidName: "default"
  experimental:
    enableYamlConfig: true

plugins:
  # The anchor is shared by two plugins.
  NodeAttestor:
    join_token:
      pluginData: &empty {}

  KeyManager:
    memory:
      pluginData: *empty

  WorkloadAttestor:
    unix:
      pluginData:
        discoverWorkloadPath: false

healthChecks:
  listenerEnabled: true
  bindPort: "8080"
