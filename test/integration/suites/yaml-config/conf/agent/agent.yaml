agent:
  data_dir: "/opt/spire/data/agent"
  log_level: "DEBUG"
  server_address: "spire-server"
  server_port: 8081
  trust_bundle_path: "/opt/spire/conf/agent/bootstrap.crt"
  trust_domain: "domain.test"
  # The TOKEN is replaced with the actual token generated by SPIRE server
  # during the test run.
  join_token: "TOKEN"
  sds:
    default_svid_name: "default"
  experimental:
    enable_yaml_config: true

plugins:
  # The anchor is shared by two plugins.
  NodeAttestor:
    join_token:
      plugin_data: &empty {}

  KeyManager:
    memory:
      plugin_data: *empty

  WorkloadAttestor:
    unix:
      plugin_data:
        discover_workload_path: false

health_checks:
  listener_enabled: true
  bind_port: "8080"
